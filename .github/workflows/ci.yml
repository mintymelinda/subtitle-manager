name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile_injection:
        description: Run the real-media MKV injection profiler (requires tests/fixtures/injection/test.mkv)
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Profile real-media injection
        if: github.event_name == 'workflow_dispatch' && inputs.profile_injection
        env:
          SUBTITLE_MANAGER_RUN_INJECTION_PROFILE: "1"
        run: |
          test -f tests/fixtures/injection/test.mkv || {
            echo "::error::Missing tests/fixtures/injection/test.mkv. Add the profiling fixture to the selected branch."
            exit 1
          }
          python -m unittest tests.test_injection_profile -v
      - name: Build Docker image
        run: docker build -t subtitle-manager:test .
