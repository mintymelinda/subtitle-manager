services:
  subtitle-manager:
    image: ghcr.io/mintymelinda/subtitle-manager:${IMAGE_TAG:-latest}
    container_name: subtitle-manager
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ${MEDIA_PATH:-/volume1/media}:/media:rw
      - ./data:/app/data
    environment:
      MEDIA_ROOT: /media
      DATABASE_PATH: /app/data/subtitle-manager.sqlite3
      TEST_MODE: ${TEST_MODE:-false}
